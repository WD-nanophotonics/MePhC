[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mephc"
version = "0.1.0"
description = "Intenal utility package."
requires-python = ">=3.10"
authors = [{ name = "MePhC contributors" }]
dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "shapely",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mephc*"]
exclude = ["examples*", "legacy*"]
[project.scripts]
relayctl = "mephc.relayctl:main"
